<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="450" y="45" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    ZooKeeper 企业级微服务协同架构全景图
  </text>
  <text x="450" y="70" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    OpenWiki 自定义知识与代码同源架构示范 (zk1MTest Demo)
  </text>

  <!-- Root ZNode -->
  <rect x="360" y="100" width="180" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="130" font-family="monospace" font-size="14" font-weight="bold" fill="#c7d2fe" text-anchor="middle">/ (Root ZNode)</text>

  <!-- Branch lines -->
  <path d="M 450 148 L 450 180 M 160 180 L 740 180 M 160 180 L 160 210 M 350 180 L 350 210 M 550 180 L 550 210 M 740 180 L 740 210" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- 4 Scenario Boxes -->
  <!-- Box 1: Locks -->
  <rect x="70" y="210" width="180" height="190" rx="10" fill="#0b0f19" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="80" y="220" width="160" height="32" rx="6" fill="url(#brandGrad)"/>
  <text x="160" y="241" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">01. 分布式锁</text>
  <text x="85" y="280" font-family="monospace" font-size="11" fill="#cbd5e1">/locks</text>
  <text x="95" y="305" font-family="monospace" font-size="10" fill="#94a3b8">├── lock-0001 (最小)</text>
  <text x="95" y="325" font-family="monospace" font-size="10" fill="#94a3b8">├── lock-0002 [Watch]</text>
  <text x="95" y="345" font-family="monospace" font-size="10" fill="#94a3b8">└── lock-0003 [Watch]</text>
  <text x="160" y="380" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">● 临时顺序 · 防惊群</text>

  <!-- Box 2: Election -->
  <rect x="260" y="210" width="180" height="190" rx="10" fill="#0b0f19" stroke="#eab308" stroke-width="1.5"/>
  <rect x="270" y="220" width="160" height="32" rx="6" fill="#ca8a04"/>
  <text x="350" y="241" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">02. 集群选主</text>
  <text x="275" y="280" font-family="monospace" font-size="11" fill="#cbd5e1">/election</text>
  <text x="285" y="305" font-family="monospace" font-size="10" fill="#fde047">├── node-001 (Leader)</text>
  <text x="285" y="325" font-family="monospace" font-size="10" fill="#94a3b8">├── node-002 (Follower)</text>
  <text x="285" y="345" font-family="monospace" font-size="10" fill="#94a3b8">└── node-003 (Follower)</text>
  <text x="350" y="380" font-family="sans-serif" font-size="10" fill="#fde047" text-anchor="middle">● Quorum过半 · ZAB容灾</text>

  <!-- Box 3: Config -->
  <rect x="460" y="210" width="180" height="190" rx="10" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="470" y="220" width="160" height="32" rx="6" fill="#0284c7"/>
  <text x="550" y="241" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">03. 动态配置中心</text>
  <text x="475" y="280" font-family="monospace" font-size="11" fill="#cbd5e1">/configs</text>
  <text x="485" y="305" font-family="monospace" font-size="10" fill="#38bdf8">└── app_config</text>
  <text x="495" y="325" font-family="monospace" font-size="9" fill="#94a3b8">timeout_ms=8000</text>
  <text x="495" y="345" font-family="monospace" font-size="9" fill="#94a3b8">max_conns=500</text>
  <text x="550" y="380" font-family="sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">● DataWatcher · 秒级热更</text>

  <!-- Box 4: Registry -->
  <rect x="650" y="210" width="180" height="190" rx="10" fill="#0b0f19" stroke="#10b981" stroke-width="1.5"/>
  <rect x="660" y="220" width="160" height="32" rx="6" fill="url(#greenGrad)"/>
  <text x="740" y="241" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">04. 服务注册发现</text>
  <text x="665" y="280" font-family="monospace" font-size="11" fill="#cbd5e1">/services</text>
  <text x="675" y="305" font-family="monospace" font-size="10" fill="#6ee7b7">└── order-service</text>
  <text x="685" y="325" font-family="monospace" font-size="9" fill="#94a3b8">├── 192.168.1.10:8080</text>
  <text x="685" y="345" font-family="monospace" font-size="9" fill="#94a3b8">└── 192.168.1.11:8080</text>
  <text x="740" y="380" font-family="sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">● 心跳维持 · 故障自愈</text>
</svg>

